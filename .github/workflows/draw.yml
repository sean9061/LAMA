name: "Draw Keymap"

on:
  workflow_dispatch:
  # push時に自動で実行する場合は、以下のコメントアウトを外す
  # push:
  #   paths:
  #     - "zmk-config/config/LAMA.keymap"
  #     - "zmk-config/keymap_drawer.config.yaml"
  #     - "zmk-config/boards/shields/LAMA/LAMA.dtsi"

jobs:
  draw:
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@main
    permissions:
      contents: write
    with:
      commit_message: "[Draw] ${{ github.event.head_commit.message || 'Update keymap drawing' }}"
      amend_commit: false
      keymap_patterns: "zmk-config/config/*.keymap"
      json_path: "zmk-config/config"
      config_path: "zmk-config/keymap_drawer.config.yaml"
      output_folder: "zmk-config/keymap-drawer"
      destination: "both"
